<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
		<meta name="theme-color" content="#1a1a1a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		%sveltekit.head%
		<style>
			/* Styles de fallback pour éviter l'écran blanc */
			* {
				box-sizing: border-box;
			}
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
			}
			body {
				background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
				color: #e0e0e0;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				min-height: 100vh;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				display: flex;
				flex-direction: column;
			}
			/* Loading state */
			#svelte {
				min-height: 100vh;
				width: 100%;
				flex: 1;
			}
			/* Fallback content visible immédiatement */
			body > div[style*="display: contents"] {
				min-height: 100vh;
				width: 100%;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div style="padding: 2rem; text-align: center; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column;">
				<h1 style="color: #667eea; margin-bottom: 1rem;">🚀 Test PWA</h1>
				<p>JavaScript est nécessaire pour cette application.</p>
				<p>Veuillez activer JavaScript dans les paramètres de votre navigateur.</p>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
